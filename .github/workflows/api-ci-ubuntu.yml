name: API CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/api/**'
  push:
    branches: [main, dev]
    paths:
      - 'apps/api/**'

env:
  HUSKY: 0

jobs:
  ci:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    container: oven/bun:1.3.14
    environment: api-test
    defaults:
      run:
        working-directory: apps/api

    env:
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EMAIL_RESEND_API_KEY: ${{ secrets.EMAIL_RESEND_API_KEY }}
      COMPANY_SOCIAL_LINKS: ${{ vars.COMPANY_SOCIAL_LINKS }}
      CAPTCHA_SECRET_KEY: ${{ secrets.CAPTCHA_SECRET_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format

      - name: Run linting
        run: bun run lint

      - name: Run type checking
        run: bun run tsc

      - name: Run tests with coverage
        run: bun run coverage

      - name: Install dependencies for Codecov
        run: apt-get update && apt-get install -y git curl gpg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: true
